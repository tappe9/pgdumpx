[package]
name = "pgdumpx-cli"
description = "Command-line inspection, extraction, and row scanning for PostgreSQL custom-format dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/pgdumpx-cli"
keywords = ["postgresql", "pg-dump", "backup", "cli", "forensics"]
categories = ["database", "command-line-utilities"]
publish = ["crates-io"]

[[bin]]
name = "pgdumpx"
path = "src/main.rs"
doc = false

[features]
default = ["lz4", "zstd"]
lz4 = ["pgdumpx/lz4"]
zstd = ["pgdumpx/zstd"]

[dependencies]
pgdumpx = { path = "../pgdumpx", version = "0.2.0", default-features = false }

[lints]
workspace = true

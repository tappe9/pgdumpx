[package]
name = "pgdumpx"
description = "A bounded, byte-oriented row scanner for PostgreSQL custom-format dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["lz4", "zstd"]
lz4 = ["dep:lz4_flex"]
zstd = []

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", optional = true, default-features = false, features = ["frame", "safe-decode"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true

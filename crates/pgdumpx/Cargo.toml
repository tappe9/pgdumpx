[package]
name = "pgdumpx"
description = "Read-only, bounded inspection, extraction, and row scanning for PostgreSQL custom-format dumps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
documentation = "https://docs.rs/pgdumpx"
keywords = ["postgresql", "pg-dump", "backup", "parser", "forensics"]
categories = ["database", "parser-implementations"]
publish = ["crates-io"]

[features]
default = ["lz4", "zstd"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:ruzstd"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", optional = true, default-features = false, features = ["frame", "safe-decode"] }
ruzstd = { version = "=0.8.1", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[lints]
workspace = true

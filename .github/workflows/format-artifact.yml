name: Format artifact

on:
  push:
    branches:
      - feat/entry-to-copy-foundations

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format sources
        run: cargo fmt
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-copy-sources
          path: |
            crates/pgdumpx/src/copy.rs
            crates/pgdumpx/src/error.rs
          if-no-files-found: error

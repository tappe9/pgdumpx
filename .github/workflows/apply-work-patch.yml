name: Apply work patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/work.patch
      - .github/workflows/apply-work-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/first-end-to-end-find

      - name: Apply and publish patch
        run: |
          git apply --index --verbose .github/work.patch
          git rm .github/work.patch .github/workflows/apply-work-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add find_first and owned rows"
          git push origin HEAD:feat/first-end-to-end-find

name: PR 84 final reviewed fixes

on:
  push:
    branches:
      - feat/issue-71-aggregate-metadata-budgets

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-71-aggregate-metadata-budgets

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt

      - name: Repair and validate reviewed documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/pgdumpx/src/copy_metadata.rs").read_text(encoding="utf-8")
          marker = "#[cfg(test)]\npub(crate) fn parse_table_data_metadata_with_limits("
          if marker not in source:
              raise SystemExit("test-only metadata parser wrapper is not gated")

          document = Path("docs/API-DESIGN.md")
          text = document.read_text(encoding="utf-8")

          bad_method = "pub fn with_metadata_index_bytes(self, value: usize) -> Self;"
          good_method = "pub fn with_max_metadata_index_bytes(self, value: usize) -> Self;"
          if bad_method in text:
              text = text.replace(bad_method, good_method, 1)
          elif good_method not in text:
              raise SystemExit("aggregate index-byte builder documentation not found")

          bad_fence = "\n`jb`\n\n`Default` delegates"
          good_fence = "\n```\n\n`Default` delegates"
          if bad_fence in text:
              text = text.replace(bad_fence, good_fence, 1)
          elif good_fence not in text:
              raise SystemExit("structural-limit code fence not found")

          document.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all --check
          python3 scripts/verify-doc-links.py
          git diff --check

      - name: Commit documentation repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Documentation is already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/API-DESIGN.md
          git commit -m "docs: repair aggregate metadata API contract"
          git push origin HEAD:feat/issue-71-aggregate-metadata-budgets

name: PR 84 final reviewed fixes

on:
  push:
    branches:
      - feat/issue-71-aggregate-metadata-budgets

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-71-aggregate-metadata-budgets

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply reviewed source and documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path("crates/pgdumpx/src/copy_metadata.rs")
          text = source.read_text(encoding="utf-8")
          signature = "pub(crate) fn parse_table_data_metadata_with_limits("
          marker = "#[cfg(test)]\n" + signature
          if marker not in text:
              if signature not in text:
                  raise SystemExit("metadata parser wrapper signature not found")
              text = text.replace(signature, marker, 1)
          source.write_text(text, encoding="utf-8")

          document = Path("docs/API-DESIGN.md")
          text = document.read_text(encoding="utf-8")
          start = text.index("## 3. Structural limits\n")
          end = text.index("## 4. Row-scan work limits\n")
          replacement = base64.b64decode("").decode("utf-8")
          document.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          cargo fmt --all
          python3 scripts/verify-doc-links.py
          git diff --check

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No reviewed fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pgdumpx/src/copy_metadata.rs docs/API-DESIGN.md
          git commit -m "fix: finalize aggregate metadata budget review"
          git push origin HEAD:feat/issue-71-aggregate-metadata-budgets

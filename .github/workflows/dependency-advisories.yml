name: Dependency advisories

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - advisory-exceptions.toml
      - scripts/verify-advisory-policy.py
      - scripts/test-advisory-policy.py
      - .github/workflows/dependency-advisories.yml
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - advisory-exceptions.toml
      - scripts/verify-advisory-policy.py
      - scripts/test-advisory-policy.py
      - .github/workflows/dependency-advisories.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-advisories-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Verify exception policy metadata
        run: python3 scripts/verify-advisory-policy.py

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check committed lockfile against current advisory database
        run: cargo deny --locked check advisories

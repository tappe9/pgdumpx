name: Issue 17 apply v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify Issue 17 v2
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect whether the patch is pending
        id: guard
        run: |
          if [ -f scripts/issue17-v2-error.txt ] || grep -q "pub struct Limits" crates/pgdumpx/src/limits.rs; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply, format, test, and lint
        id: develop
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 scripts/apply_issue17_v2.py
            cargo fmt
            cargo test -p pgdumpx --all-features
            cargo clippy -p pgdumpx --all-targets --all-features -- -D warnings
          } > scripts/issue17-v2-error.txt 2>&1

      - name: Commit verified production changes
        if: steps.guard.outputs.run == 'true' && steps.develop.outcome == 'success'
        run: |
          rm -f scripts/issue17-v2-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/pgdumpx/src/archive.rs \
            crates/pgdumpx/src/archive_primitives_tests.rs \
            crates/pgdumpx/src/copy.rs \
            crates/pgdumpx/src/copy_metadata.rs \
            crates/pgdumpx/src/copy_tests.rs \
            crates/pgdumpx/src/custom/header.rs \
            crates/pgdumpx/src/custom/primitives.rs \
            crates/pgdumpx/src/custom/toc.rs \
            crates/pgdumpx/src/error.rs \
            crates/pgdumpx/src/lib.rs \
            crates/pgdumpx/src/limits.rs \
            crates/pgdumpx/src/metadata_open_tests.rs \
            crates/pgdumpx/src/table_rows.rs
          git commit -m "feat: add public structural limits"
          git push origin HEAD:${{ github.head_ref }}

      - name: Commit failure diagnostics
        if: steps.guard.outputs.run == 'true' && steps.develop.outcome == 'failure'
        run: |
          cat scripts/issue17-v2-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/issue17-v2-error.txt
          git commit -m "chore: capture Issue 17 v2 patch failure"
          git push origin HEAD:${{ github.head_ref }}

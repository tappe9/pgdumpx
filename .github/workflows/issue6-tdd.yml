name: Issue 6 TDD

on:
  push:
    branches:
      - feat/issue-6-checked-archive-primitives

permissions:
  contents: read

jobs:
  focused:
    name: Focused primitive tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Focused tests
        run: cargo test -p pgdumpx --lib

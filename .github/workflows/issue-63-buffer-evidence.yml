name: Issue 63 buffer evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Reproducible buffer evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install GNU time
        run: |
          sudo apt-get update
          sudo apt-get install -y time

      - name: Verify deterministic two-table dataset
        env:
          PGDUMPX_BENCH_REPRO_ROWS: 101
        run: bash scripts/verify-benchmark-reproducibility.sh

      - name: Generate representative benchmark dataset
        env:
          PGDUMPX_BENCH_ROWS: 100000
        run: bash scripts/generate-benchmark-dataset.sh

      - name: Run bounded buffer candidate matrix
        env:
          PGDUMPX_BUFFER_BENCH_WARMUP: 1
          PGDUMPX_BUFFER_BENCH_REPETITIONS: 5
          PGDUMPX_BUFFER_BENCH_RSS_REPETITIONS: 3
          PGDUMPX_BUFFER_BENCH_RESULTS_DIR: target/benchmark-results/issue-63
        run: bash scripts/run-buffer-tuning-benchmarks.sh

      - name: Summarize buffer evidence
        run: |
          python3 scripts/summarize-buffer-tuning.py target/benchmark-results/issue-63
          cat target/benchmark-results/issue-63/candidate-summary.tsv
          cat target/benchmark-results/issue-63/decision.tsv

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-63-buffer-evidence
          path: target/benchmark-results/issue-63/
          if-no-files-found: error

name: Issue 17 repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    name: Repair and fully verify Issue 17
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect whether repair is ready and pending
        id: guard
        run: |
          if ! grep -q "pub struct Limits" crates/pgdumpx/src/limits.rs || [ -f scripts/issue17-repair-state.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Rust 1.85.0
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Repair and verify
        id: verify
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 scripts/apply_issue17_repair.py
            cargo fmt
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
            cargo +1.85.0 check --workspace --all-targets --all-features
          } > scripts/issue17-repair-state.txt 2>&1

      - name: Record success
        if: steps.guard.outputs.run == 'true' && steps.verify.outcome == 'success'
        run: printf 'success\n' > scripts/issue17-repair-state.txt

      - name: Commit repair state
        if: steps.guard.outputs.run == 'true'
        run: |
          cat scripts/issue17-repair-state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pgdumpx/src scripts/issue17-repair-state.txt
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            git commit -m "refactor: unify structural limit paths"
          else
            git commit -m "chore: capture Issue 17 repair state"
          fi
          git push origin HEAD:${{ github.head_ref }}

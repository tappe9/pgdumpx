name: Issue 17 final application

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Rebuild and verify Issue 17 from main
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect whether final application is pending
        id: guard
        run: |
          if [ -f scripts/issue17-final-state.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Rust 1.85.0
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Rebuild from main and run all gates
        id: verify
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git fetch origin main
            git checkout origin/main -- crates/pgdumpx/src
            python3 scripts/apply_issue17_final.py
            cargo fmt
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-features
            RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
            cargo +1.85.0 check --workspace --all-targets --all-features
          } > scripts/issue17-final-state.txt 2>&1

      - name: Record success
        if: steps.guard.outputs.run == 'true' && steps.verify.outcome == 'success'
        run: printf 'success\n' > scripts/issue17-final-state.txt

      - name: Commit final generated state
        if: steps.guard.outputs.run == 'true'
        run: |
          cat scripts/issue17-final-state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pgdumpx/src scripts/issue17-final-state.txt
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            git commit -m "feat: add public structural limits"
          else
            git commit -m "chore: capture final Issue 17 state"
          fi
          git push origin HEAD:${{ github.head_ref }}

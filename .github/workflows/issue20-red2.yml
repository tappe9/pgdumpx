name: Issue 20 red tests v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  red:
    name: Commit and confirm Issue 20 Red after Issue 17
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect whether Issue 20 Red is ready and pending
        id: guard
        run: |
          if ! grep -qx "success" scripts/issue17-final4-state.txt 2>/dev/null || [ -f crates/pgdumpx-cli/tests/metadata.rs ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt

      - name: Add acceptance tests
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 scripts/add_issue20_tests.py
          cargo fmt

      - name: Confirm intended Red
        if: steps.guard.outputs.run == 'true'
        run: |
          set +e
          cargo test -p pgdumpx-cli --test metadata > scripts/issue20-red2-state.txt 2>&1
          status=$?
          set -e
          cat scripts/issue20-red2-state.txt
          if [ "$status" -eq 0 ]; then
            echo "Issue 20 acceptance tests unexpectedly passed before production implementation" >&2
            exit 1
          fi
          printf 'red: inspect/list commands are not implemented\n' > scripts/issue20-red2-state.txt

      - name: Commit Red tests
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pgdumpx-cli/tests/metadata.rs scripts/issue20-red2-state.txt
          git commit -m "test: define metadata CLI contract"
          git push origin HEAD:${{ github.head_ref }}

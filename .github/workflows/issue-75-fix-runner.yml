name: Repair Issue 75 implementation runner

on:
  push:
    branches:
      - feat/issue-75-finite-find-defaults

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Correct Japanese exit-contract replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/issue-75-implement.yml')
          text = path.read_text()
          old = '"2+ usage、I/O、format、integrity、decompression、COPY、encoding、",\n              "2  usage、I/O、format、integrity、decompression、COPY、encoding、",'
          new = '"2+ usage / I/O / format / integrity / decompression / COPY / encoding /",\n              "2  usage / I/O / format / integrity / decompression / COPY / encoding /",'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected replacement count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-75-fix-runner.yml
          git add .github/workflows/issue-75-implement.yml
          git diff --cached --check
          git commit -m "fix(ci): correct Issue 75 documentation transform"
          git push origin HEAD:feat/issue-75-finite-find-defaults

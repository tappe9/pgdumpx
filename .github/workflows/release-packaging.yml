name: Release packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Package, license, and runtime audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Diagnose lockfile drift
        run: |
          cargo generate-lockfile
          echo '---BEGIN CARGO LOCK---'
          cat Cargo.lock
          echo '---END CARGO LOCK---'

      - name: Verify publish preflight
        run: python3 scripts/verify-release-packaging.py

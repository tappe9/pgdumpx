name: Export source snapshot

on:
  push:
    branches:
      - feat/first-end-to-end-find
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/pgdumpx-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pgdumpx-source
          path: /tmp/pgdumpx-source.tar.gz
          retention-days: 1

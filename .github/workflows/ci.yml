name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  fuzz-smoke:
    name: Fuzz target smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Smoke fuzz targets
        run: |
          for target in archive_open toc_metadata entry_framing copy_rows copy_metadata limit_accounting; do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -runs=64 -max_len=65536 -timeout=2
          done

  compatibility-differential:
    name: Compatibility differential
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build pgdumpx CLI with all compression backends
        run: cargo build -p pgdumpx-cli --all-features

      - name: Compare selected entry output with pg_restore
        run: bash scripts/check-compatibility-differential.sh

  lz4-disabled:
    name: LZ4 backend disabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Verify metadata-only behavior without LZ4 backend
        run: cargo test -p pgdumpx --no-default-features --test lz4_backend

  zstd-disabled:
    name: Zstandard backend disabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Verify metadata-only behavior without Zstandard backend
        run: cargo test -p pgdumpx --no-default-features --features lz4 --test zstd_backend

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Check workspace
        run: cargo +1.85.0 check --workspace --all-targets --all-features

  issue28-benchmark-verification:
    name: Issue 28 benchmark verification (temporary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Install GNU time
        run: sudo apt-get update && sudo apt-get install -y time

      - name: Test benchmark runner argument invariants
        run: cargo test -p pgdumpx --example benchmark_runner --all-features

      - name: Verify deterministic dataset regeneration
        env:
          PGDUMPX_BENCH_REPRO_ROWS: 101
        run: bash scripts/verify-benchmark-reproducibility.sh

      - name: Generate benchmark smoke dataset
        env:
          PGDUMPX_BENCH_ROWS: 101
        run: bash scripts/generate-benchmark-dataset.sh

      - name: Run benchmark smoke matrix
        env:
          PGDUMPX_BENCH_WARMUP: 0
          PGDUMPX_BENCH_REPETITIONS: 1
          PGDUMPX_BENCH_RESULTS_DIR: target/benchmark-results/smoke
        run: bash scripts/run-benchmarks.sh

      - name: Validate benchmark evidence outputs
        run: |
          test -s target/benchmark-results/smoke/metadata.tsv
          test -s target/benchmark-results/smoke/throughput.tsv
          test -s target/benchmark-results/smoke/peak-rss.tsv
          test "$(tail -n +2 target/benchmark-results/smoke/peak-rss.tsv | wc -l)" -eq 8
          grep -q $'find\tnone\t1.16.0\tearly\tscan-unlimited' target/benchmark-results/smoke/throughput.tsv
          grep -q $'find\tzstd\t1.16.0\tabsent\tscan-both' target/benchmark-results/smoke/throughput.tsv

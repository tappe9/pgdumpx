name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_issue17:
        description: Apply the temporary Issue 17 development patch
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Check workspace
        run: cargo +1.85.0 check --workspace --all-targets --all-features

  apply-issue17:
    name: Apply Issue 17 development patch
    if: github.event_name == 'workflow_dispatch' && inputs.apply_issue17
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply checked replacements
        run: python3 scripts/apply_issue17.py

      - name: Format
        run: cargo fmt

      - name: Test library
        run: cargo test -p pgdumpx --all-features

      - name: Clippy library
        run: cargo clippy -p pgdumpx --all-targets --all-features -- -D warnings

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/pgdumpx/src/archive.rs \
            crates/pgdumpx/src/archive_primitives_tests.rs \
            crates/pgdumpx/src/copy.rs \
            crates/pgdumpx/src/copy_metadata.rs \
            crates/pgdumpx/src/copy_tests.rs \
            crates/pgdumpx/src/custom/header.rs \
            crates/pgdumpx/src/custom/primitives.rs \
            crates/pgdumpx/src/custom/toc.rs \
            crates/pgdumpx/src/error.rs \
            crates/pgdumpx/src/lib.rs \
            crates/pgdumpx/src/limits.rs \
            crates/pgdumpx/src/metadata_open_tests.rs \
            crates/pgdumpx/src/table_rows.rs
          git commit -m "feat: add public structural limits"
          git push origin HEAD:${{ github.ref_name }}

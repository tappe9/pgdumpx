name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Documentation links
        run: python3 scripts/verify-doc-links.py

      - name: Advisory policy contract
        run: python3 scripts/test-advisory-policy.py

      - name: Fuzz campaign contract
        run: python3 scripts/test-fuzz-campaign.py

      - name: Workflow policy contract
        run: python3 scripts/test-workflow-policy.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  platform-stable:
    name: Platform stable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Test workspace with all compression backends
        run: cargo test --workspace --all-features

      - name: Verify default CLI supports all v0.1 compression backends
        run: cargo test -p pgdumpx-cli --test compression_defaults

  feature-matrix:
    name: Library features (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
          - name: no-optional-compression
            cargo_args: --no-default-features
          - name: lz4-only
            cargo_args: --no-default-features --features lz4
          - name: zstd-only
            cargo_args: --no-default-features --features zstd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy

      - name: Test complete applicable library suite
        run: cargo test -p pgdumpx ${{ matrix.cargo_args }}

      - name: Deny warnings across all library targets
        run: cargo clippy -p pgdumpx --all-targets ${{ matrix.cargo_args }} -- -D warnings

  fixture-integrity:
    name: Fixture provenance and compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Verify fixture manifest, checksums, and compatibility contract
        run: |
          cargo test -p pgdumpx --all-features --test fixture_manifest
          cargo test -p pgdumpx --all-features --test compatibility_completion

  fuzz-smoke:
    name: Fuzz target smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Smoke fuzz targets
        run: |
          for target in archive_open toc_metadata entry_framing copy_rows copy_metadata limit_accounting; do
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" -- -runs=64 -max_len=65536 -timeout=2
          done

  benchmark-smoke:
    name: Benchmark target smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build benchmark targets
        run: |
          cargo build -p pgdumpx --example benchmark_runner --all-features
          cargo build -p pgdumpx --example buffer_tuning_runner --all-features

      - name: Smoke benchmark CLIs without performance execution
        run: |
          cargo run -p pgdumpx --example benchmark_runner --all-features -- --help
          cargo run -p pgdumpx --example buffer_tuning_runner --all-features -- --help

  compatibility-differential:
    name: Compatibility differential
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build pgdumpx CLI with all compression backends
        run: cargo build -p pgdumpx-cli --all-features

      - name: Compare selected entry output with pg_restore
        run: bash scripts/check-compatibility-differential.sh

  msrv:
    name: MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0

      - name: Check workspace
        run: cargo +1.85.0 check --workspace --all-targets --all-features

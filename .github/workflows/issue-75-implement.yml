name: Implement Issue 75 finite find defaults

on:
  push:
    branches:
      - feat/issue-75-finite-find-defaults

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Apply implementation
        run: |
          python3 .github/scripts/issue-75-apply.py
          cargo fmt --all

      - name: Focused CLI tests
        run: |
          cargo test -p pgdumpx-cli --bin pgdumpx
          cargo test -p pgdumpx-cli --test find_default_limits
          cargo test -p pgdumpx-cli --test find_limits
          cargo test -p pgdumpx-cli --test find

      - name: Full quality gates
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check
          python3 scripts/verify-doc-links.py
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo doc --workspace --all-features --no-deps
          cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-75-implement.yml \
            .github/scripts/issue-75-apply.py
          git add crates/pgdumpx-cli/src/main.rs \
            crates/pgdumpx-cli/tests/find_default_limits.rs \
            README.md README.ja.md SECURITY.md ROADMAP.md \
            docs/FIND-SCAN-LIMITS.md
          git diff --cached --check
          git commit -m "feat(cli): apply finite default find budgets"
          git push origin HEAD:feat/issue-75-finite-find-defaults

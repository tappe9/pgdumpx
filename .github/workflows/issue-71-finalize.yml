name: Issue 71 verified finalization

on:
  push:
    branches:
      - feat/issue-71-aggregate-metadata-budgets
    paths:
      - .github/workflows/issue-71-finalize.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-71-verified-finalization
  cancel-in-progress: false

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize final tree and remove helper workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("crates/pgdumpx/src/copy_metadata.rs")
          text = source.read_text(encoding="utf-8")
          signature = "pub(crate) fn parse_table_data_metadata_with_limits("
          marker = "#[cfg(test)]\n" + signature
          if marker not in text:
              text = text.replace(signature, marker, 1)
          source.write_text(text, encoding="utf-8")

          document = Path("docs/API-DESIGN.md")
          text = document.read_text(encoding="utf-8")
          start = text.index("## 3. Structural limits\n")
          end = text.index("## 4. Row-scan work limits\n")
          replacement = '''## 3. Structural limits

Configuration fields remain private so the type can evolve without turning struct-literal layout into a compatibility promise.

Implemented shape:

```rust
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
pub struct Limits {
    max_toc_entries: usize,
    max_string_bytes: usize,
    max_dependencies_per_entry: usize,
    max_metadata_string_bytes: usize,
    max_metadata_dependencies: usize,
    max_metadata_index_bytes: usize,
    max_row_bytes: usize,
    max_fields_per_row: usize,
}

impl Limits {
    pub fn default_compatible() -> Self;
    pub fn with_max_toc_entries(self, value: usize) -> Self;
    pub fn with_max_string_bytes(self, value: usize) -> Self;
    pub fn with_max_dependencies_per_entry(self, value: usize) -> Self;
    pub fn with_max_metadata_string_bytes(self, value: usize) -> Self;
    pub fn with_max_metadata_dependencies(self, value: usize) -> Self;
    pub fn with_max_metadata_index_bytes(self, value: usize) -> Self;
    pub fn with_max_row_bytes(self, value: usize) -> Self;
    pub fn with_max_fields_per_row(self, value: usize) -> Self;
}
```

`Default` delegates to finite compatibility-oriented limits. In addition to the existing per-item bounds, the defaults permit at most 256 MiB of retained header/TOC string bytes, 1,000,000 retained dependencies across all TOC entries, and 64 MiB of variable-length names duplicated into derived metadata/index structures. The index-byte budget covers table schema/name lookup keys and both the ordered and lookup copies of COPY column names. Fixed-size map entries remain bounded by the TOC and field-count limits.

Per-item validation occurs first. An individual string, one entry's dependency list, or one COPY column layout that violates its existing bound therefore retains the existing typed error. Values that pass those checks are charged incrementally to the relevant aggregate counter before retained allocation or growth where possible. All aggregate counters use checked arithmetic, accept a value exactly equal to the configured limit, and reject the first value above it with typed limit, attempted usage, and archive context.

These limits bound metadata retained while opening an archive and the variable-length names materially duplicated by its lookup structures. They do not by themselves bound entry payload, decompression, COPY row, or operation scan work; those remain governed by row structural limits, `ScanLimits`, and `EntryReadLimits`.

'''
          document.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          for helper in (
              ".github/workflows/issue-71-doc-patch.yml",
              ".github/workflows/issue-71-cleanup.yml",
              ".github/workflows/issue-71-finalize.yml",
          ):
              Path(helper).unlink(missing_ok=True)
          PY
          cargo fmt --all
          git diff --check

      - name: Commit exact final head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: finalize aggregate metadata budgets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify formatting and documentation links
        run: |
          cargo fmt --all --check
          python3 scripts/verify-doc-links.py

      - name: Verify warning-clean all-feature workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify workspace tests
        run: cargo test --workspace --all-features

      - name: Verify focused aggregate metadata limits without optional compression
        run: cargo test -p pgdumpx --no-default-features --test aggregate_metadata_limits

      - name: Verify rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Verify MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --all-features

      - name: Confirm PR still points to verified head
        run: |
          REMOTE_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/84" --jq .head.sha)
          test "$REMOTE_HEAD" = "$FINAL_HEAD"

      - name: Record verification and make PR ready
        run: |
          gh pr comment 84 --body "Verified final head \`$FINAL_HEAD\`: format, doc links, warning-denying Clippy, all-feature workspace tests, focused no-default-feature aggregate-limit tests, rustdoc, and MSRV 1.85.0 all passed. The merge request below is exact-SHA guarded."
          gh pr ready 84

      - name: Squash merge exact verified head
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/84/merge" \
            -f merge_method=squash \
            -f sha="$FINAL_HEAD" \
            -f commit_title="feat: add aggregate metadata resource budgets (#84)" \
            -f commit_message=$'Bound cumulative retained metadata strings, TOC dependencies, and variable-length derived/index names with checked typed limits.\n\nPreserve per-item error precedence, document finite defaults and limit interaction, and add exact-boundary, multi-entry, index-allocation, and overflow regressions.\n\nCloses #71' \
            --jq '.merged' | grep -qx true

name: Issue 17 apply v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify, and capture Issue 17
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect whether v3 has already run
        id: guard
        run: |
          if [ -f scripts/issue17-v3-state.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.guard.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply and verify
        id: develop
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            if ! grep -q "pub struct Limits" crates/pgdumpx/src/limits.rs; then
              python3 scripts/apply_issue17_v2.py
            fi
            python3 scripts/apply_issue17_fixups.py
            cargo fmt
            cargo test -p pgdumpx --all-features
            cargo clippy -p pgdumpx --all-targets --all-features -- -D warnings
          } > scripts/issue17-v3-state.txt 2>&1

      - name: Record success
        if: steps.guard.outputs.run == 'true' && steps.develop.outcome == 'success'
        run: printf 'success\n' > scripts/issue17-v3-state.txt

      - name: Commit generated state
        if: steps.guard.outputs.run == 'true'
        run: |
          cat scripts/issue17-v3-state.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/pgdumpx/src scripts/issue17-v3-state.txt
          if [ "${{ steps.develop.outcome }}" = "success" ]; then
            git commit -m "feat: add public structural limits"
          else
            git commit -m "chore: capture Issue 17 generated state"
          fi
          git push origin HEAD:${{ github.head_ref }}
